openapi: 3.0.0
info:
  title: Calendar Booking API
  version: 0.0.0
tags: []
paths:
  /admin/bookings/upcoming:
    get:
      operationId: AdminApi_listUpcomingBookings
      description: List upcoming bookings for all event types.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBookingListResult'
  /admin/bookings/{booking_id}/cancel:
    post:
      operationId: AdminApi_cancelBooking
      description: Cancel a booking and free its slot.
      parameters:
        - name: booking_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBooking'
        '404':
          description: Entity not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
  /admin/event-types:
    post:
      operationId: AdminApi_createEventType
      description: Create a new event type.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventType'
        '400':
          description: Invalid request or validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventTypeCreate'
    get:
      operationId: AdminApi_listEventTypes
      description: List all event types.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventTypeListResult'
  /admin/event-types/{event_type_id}:
    get:
      operationId: AdminApi_getEventType
      description: Get an event type by identifier.
      parameters:
        - name: event_type_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventType'
        '404':
          description: Entity not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
  /admin/schedule:
    get:
      operationId: AdminApi_getSchedule
      description: Get schedule with free and busy slots for the next 14 days. If from/to are omitted, the window starts at current date.
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
          explode: false
        - name: to
          in: query
          required: false
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotListResult'
  /admin/settings:
    get:
      operationId: AdminApi_getSettings
      description: Get admin settings including owner profile and workday settings.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSettings'
    patch:
      operationId: AdminApi_updateSettings
      description: Update admin settings including owner profile and workday settings.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSettings'
        '400':
          description: Invalid request or validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminSettingsUpdate'
  /bookings:
    post:
      operationId: GuestApi_createBooking
      description: Create a booking for the selected slot. Slot must be free and within the 14-day window. Slot time cannot overlap any existing booking across all event types.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: Invalid request or validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
        '404':
          description: Entity not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '409':
          description: Slot already booked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
        '422':
          description: Slot outside the 14-day booking window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutOfWindowError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreate'
  /event-types:
    get:
      operationId: GuestApi_listEventTypes
      description: List available event types.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventTypeListResult'
  /event-types/{event_type_id}:
    get:
      operationId: GuestApi_getEventType
      description: Get an event type by identifier.
      parameters:
        - name: event_type_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventType'
        '404':
          description: Entity not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
  /slots:
    get:
      operationId: GuestApi_listSlots
      description: Get slots with free/busy status within the 14-day booking window. If from/to are omitted, the window starts at current date.
      parameters:
        - name: event_type_id
          in: query
          required: true
          schema:
            type: string
          explode: false
        - name: from
          in: query
          required: false
          schema:
            type: string
          explode: false
        - name: to
          in: query
          required: false
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotListResult'
        '400':
          description: Invalid request or validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
components:
  schemas:
    AdminBooking:
      type: object
      required:
        - id
        - event_type_id
        - event_type_name
        - slot_id
        - slot_start
        - name
        - email
        - created_at
        - status
      properties:
        id:
          type: string
          description: Booking identifier.
        event_type_id:
          type: string
          description: Related event type identifier.
        event_type_name:
          type: string
          description: Event type name.
        slot_id:
          type: integer
          format: int64
          description: Related slot identifier.
        slot_start:
          type: string
          format: date-time
          description: Slot start time in ISO 8601 format.
        name:
          type: string
          description: Guest name.
        email:
          type: string
          format: email
          description: Guest email.
        created_at:
          type: string
          format: date-time
          description: Booking creation time in ISO 8601 format.
        status:
          allOf:
            - $ref: '#/components/schemas/BookingStatus'
          description: Booking status.
      description: Booking summary for admin usage.
    AdminBookingListResult:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminBooking'
    AdminSettings:
      type: object
      required:
        - owner
        - booking_window_days
      properties:
        owner:
          $ref: '#/components/schemas/Owner'
        booking_window_days:
          type: integer
          format: int32
          description: Default booking window size in days. Fixed to 14.
    AdminSettingsUpdate:
      type: object
      required:
        - name
        - avatar_url
        - workday_start
        - workday_end
      properties:
        name:
          type: string
          description: Owner display name.
        avatar_url:
          type: string
          description: URL to owner avatar image.
        workday_start:
          type: string
          description: Workday start time in HH:mm format.
        workday_end:
          type: string
          description: Workday end time in HH:mm format.
    BadRequestError:
      type: object
      required:
        - body
      properties:
        body:
          $ref: '#/components/schemas/ErrorResponse'
      description: Invalid request or validation error.
    Booking:
      type: object
      required:
        - id
        - event_type_id
        - slot_id
        - name
        - email
        - created_at
      properties:
        id:
          type: string
          description: Booking identifier.
        event_type_id:
          type: string
          description: Related event type identifier.
        slot_id:
          type: integer
          format: int64
          description: Related slot identifier.
        name:
          type: string
          description: Guest name.
        email:
          type: string
          format: email
          description: Guest email.
        created_at:
          type: string
          format: date-time
          description: Booking creation time in ISO 8601 format.
      description: Booking created by a guest.
    BookingCreate:
      type: object
      required:
        - event_type_id
        - slot_id
        - name
        - email
      properties:
        event_type_id:
          type: string
        slot_id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
          format: email
    BookingListResult:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Booking'
    BookingStatus:
      type: string
      enum:
        - active
        - cancelled
      description: Booking status.
    ConflictError:
      type: object
      required:
        - body
      properties:
        body:
          $ref: '#/components/schemas/ErrorResponse'
      description: Slot already booked.
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Error code identifier.
        message:
          type: string
          description: Human-readable error message.
    EventType:
      type: object
      required:
        - id
        - name
        - description
        - duration_minutes
      properties:
        id:
          type: string
          description: Event type identifier.
        name:
          type: string
          description: Event type name.
        description:
          type: string
          description: Event type description.
        duration_minutes:
          type: integer
          format: int32
          description: Event duration in minutes.
      description: Event type configuration.
    EventTypeCreate:
      type: object
      required:
        - name
        - description
        - duration_minutes
      properties:
        name:
          type: string
        description:
          type: string
        duration_minutes:
          type: integer
          format: int32
    EventTypeListResult:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EventType'
      example:
        items:
          - id: event-15
            name: Встреча 15 минут
            description: Короткая встреча для быстрого обсуждения
            duration_minutes: 15
          - id: event-30
            name: Встреча 30 минут
            description: Стандартная встреча для детального обсуждения
            duration_minutes: 30
    NotFoundError:
      type: object
      required:
        - body
      properties:
        body:
          $ref: '#/components/schemas/ErrorResponse'
      description: Entity not found.
    OutOfWindowError:
      type: object
      required:
        - body
      properties:
        body:
          $ref: '#/components/schemas/ErrorResponse'
      description: Slot outside the 14-day booking window.
    Owner:
      type: object
      required:
        - id
        - name
        - avatar_url
        - workday_start
        - workday_end
      properties:
        id:
          type: string
          description: Owner identifier.
        name:
          type: string
          description: Owner display name.
        avatar_url:
          type: string
          description: URL to owner avatar image.
        workday_start:
          type: string
          description: Workday start time in HH:mm format.
        workday_end:
          type: string
          description: Workday end time in HH:mm format.
      description: Calendar owner profile.
    Slot:
      type: object
      required:
        - id
        - event_type_id
        - start
        - end
        - status
      properties:
        id:
          type: integer
          format: int64
          description: Slot identifier.
        event_type_id:
          type: string
          description: Related event type identifier.
        start:
          type: string
          format: date-time
          description: Slot start time in ISO 8601 format.
        end:
          type: string
          format: date-time
          description: Slot end time in ISO 8601 format.
        status:
          allOf:
            - $ref: '#/components/schemas/SlotStatus'
          description: Slot availability status.
      description: Availability slot within the booking window.
    SlotListResult:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Slot'
      example:
        items:
          - id: 101
            event_type_id: event-15
            start: '2026-05-05T09:00:00Z'
            end: '2026-05-05T09:15:00Z'
            status: free
