name: ci-tests

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build test image
        run: docker build --target test -t app-test .

      - name: Run tests in container
        run: docker run --rm -e CI=1 app-test
